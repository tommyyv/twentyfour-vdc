[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[project]
name = "twentyfour-vdc"
version = "0.1.0"
authors = [{ name = "capy" }]
description = "bios firmware updater and configurer"
readme = "README.md"
license = "Unlicense"
license-files = ["UNLICENSE"]

requires-python = ">=3.15"
dependencies = [
  "fastapi[standard]",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "alembic",
  "pydantic",
  "pydantic-settings",
  "pydantic-extra-types",
]

[dependency-groups]
dev = ["basedpyright", "ruff", "pytest", "pytest-cov"]

[tool.fastapi]
entrypoint = "twentyfour_vdc.main:app"
