[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[project]
name = "24vdc"
version = "0.1.0"
authors = [{ name = "capy" }]
description = "bios firmware updater and configurer"
readme = "README.md"
license = "Unlicense"
license-files = ["UNLICENSE"]

requires-python = ">=3.15"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "alembic",
  "pydantic",
  "pydantic-settings",
  "jinja2",
  "python-multipart",
]

[dependency-groups]
dev = ["basedpyright", "ruff", "pytest", "pytest-cov", "httpx"]

[project.scripts]
24vdc = "24vdc:main"
